<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headrush Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 100%;
      height: 100vh;
      background: #0e0e0f;
      color: #e8e8ec;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .logo { font-size: 20px; }
    h1 { font-size: 15px; font-weight: 700; }
    .subtitle { font-size: 11px; color: #888890; margin-top: 1px; }

    .status-card {
      background: #1a1a1e;
      border: 1px solid #333338;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected    { background: #22aa77; }
    .status-dot.disconnected { background: #e74c3c; }
    .status-dot.checking     { background: #e07020; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .status-text { font-size: 13px; font-weight: 600; }
    .status-sub  { font-size: 11px; color: #888890; margin-top: 2px; }

    button {
      background: #1a3a2a;
      color: #22aa77;
      border: 1px solid #22aa77;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    button:hover { background: #22aa77; color: #fff; }
    button:disabled { background: #252529; color: #888890; border-color: #333338; cursor: not-allowed; }

    .link-btn {
      background: none;
      border: none;
      color: #888890;
      font-size: 11px;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .link-btn:hover { color: #e8e8ec; }
    .manual-ip-toggle { text-align: right; margin: -6px 0 12px; flex-shrink: 0; }

    .pair-cancel-btn {
      display: none;
      margin-top: 8px;
      width: 100%;
      background: transparent;
      color: #888890;
      border-color: #333338;
      font-size: 12px;
      flex-shrink: 0;
    }

    .logs-section {
      margin-top: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #333338;
      border-radius: 8px;
      background: #1a1a1e;
    }
    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #333338;
      background: #0e0e0f;
      font-size: 11px;
      font-weight: 700;
      color: #888890;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #888890;
      font-size: 11px;
      padding: 0;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .clear-btn:hover { color: #e8e8ec; }
    .log-container {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-entry { word-break: break-word; }
    .log-entry.info    { color: #888890; }
    .log-entry.success { color: #22aa77; }
    .log-entry.error   { color: #e74c3c; }
    .log-time { color: #333338; margin-right: 6px; }

    .manual-ip {
      display: none;
      background: #1a1a1e;
      border: 1px solid #333338;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .manual-ip-label {
      display: block;
      font-size: 11px;
      color: #888890;
      margin-bottom: 8px;
    }
    .manual-ip-row {
      display: flex;
      gap: 8px;
    }
    .manual-ip-row input {
      flex: 1;
      min-width: 0;
      background: #0e0e0f;
      border: 1px solid #333338;
      border-radius: 8px;
      color: #e8e8ec;
      font-size: 13px;
      padding: 8px 10px;
      font-family: inherit;
    }
    .manual-ip-row input:focus { outline: none; border-color: #22aa77; }

    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #888890;
      text-align: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚡</span>
    <div>
      <h1>Headrush Companion</h1>
      <div class="subtitle">Local connector for headrush.zybler.se</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-dot checking" id="dot"></div>
    <div style="flex:1">
      <div class="status-text" id="status-text">Checking…</div>
      <div class="status-sub" id="status-sub">Connecting to pedal</div>
    </div>
    <button id="connect-btn">Connect</button>
  </div>

  <button id="pair-cancel-btn" class="pair-cancel-btn">Cancel pairing</button>

  <div class="manual-ip-toggle">
    <button class="link-btn" id="manual-ip-link">Enter IP manually</button>
  </div>

  <div class="manual-ip" id="manual-ip">
    <label class="manual-ip-label" for="ip-input">Couldn't find your pedal automatically. Enter its IP address:</label>
    <div class="manual-ip-row">
      <input type="text" id="ip-input" placeholder="192.168.1.42" autocomplete="off" spellcheck="false">
      <button id="ip-connect-btn">Connect</button>
    </div>
  </div>

  <div class="logs-section">
    <div class="logs-header">
      <span>Logs</span>
      <button class="clear-btn" id="clear-btn">Clear</button>
    </div>
    <div class="log-container" id="log-container">
      <div class="log-entry info"><span class="log-time">—</span>Ready</div>
    </div>
  </div>

  <button id="disconnect-btn" style="margin-top:10px;width:100%;background:transparent;color:#888890;border-color:#333338;font-size:12px;">Disconnect</button>

  <script src="popup.js"></script>
</body>
</html>
