name: Build RushLink desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "rushlink-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies
        run: npm ci
      - name: Verify repository and runtime dependencies
        run: |
          npm run check:repo
          npm audit --omit=dev
      - name: Test application
        run: npm test -- --maxWorkers=2
      - name: Test native transport
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verify clean release payload
        run: npm run release:check
      - name: Build installers and create draft alpha release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: rushlink-v__VERSION__
          releaseName: RushLink by Cygma Audio v__VERSION__ — for HeadRush firmware 5.2.0 (early alpha)
          releaseBody: |
            This RushLink release targets HeadRush firmware **5.2.0**. The RushLink application version is **__VERSION__**, separate from the HeadRush firmware version.

            Early alpha desktop build. Back up important rigs before use. Hardware verification covers Flex Prime on 5.2.0; Prime and Core require independent hardware verification. Firmware 5.1 retains capability-based single-NAM fallback.

            Multiple NAM blocks are supported in the Rig Editor and Test Rig Studio. Verified limits remain two A2 Full or four A2 Lite captures across two independent NAM hosts; there is no verified processing-limit bypass.

            Release notes: https://github.com/Rush-Link/RushLink-App/blob/rushlink-v__VERSION__/docs/releases/__VERSION__.md

            Windows: x64 installer. macOS: choose Apple Silicon or Intel. Linux: x64 Debian and AppImage preview packages.
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 1
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "RushLink_[version]_[platform]_[arch][_setup].[ext]"
