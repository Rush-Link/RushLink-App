name: Build RushLink macOS preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/macos-*'

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Keep proprietary sources and preview artifacts in the private repository.
    if: github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install browser for release checks
        run: npx playwright install chromium
      - name: Test application
        run: npm test
      - name: Test native macOS transport
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verify clean release payload
        run: npm run release:check
      - name: Build ad-hoc signed DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build --ci --bundles dmg --target ${{ matrix.target }} -- --locked
      - name: Verify app signature and architecture
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$RELEASE_TARGET/release/bundle/macos/RushLink.app"
          codesign --verify --deep --strict "$app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          file "$executable"
          test "$(lipo -archs "$executable")" = "$RELEASE_ARCH"
          expected_version="$(node -p "require('./package.json').version")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$actual_version" = "$expected_version"
      - name: Verify DMG integrity
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for dmg in src-tauri/target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - name: Stage DMG and checksum only
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          stage="release-artifacts/macos-$RELEASE_ARCH"
          mkdir -p "$stage"
          cp src-tauri/target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg "$stage/"
          cd "$stage"
          shasum -a 256 -- *.dmg > "SHA256SUMS-macos-$RELEASE_ARCH.txt"
          shasum -a 256 --check "SHA256SUMS-macos-$RELEASE_ARCH.txt"
      - name: Upload private macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: RushLink-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: release-artifacts/macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
