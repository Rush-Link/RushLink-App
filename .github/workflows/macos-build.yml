name: Build RushLink macOS preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/macos-*'

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Test application
        run: npm test
      - name: Test native macOS transport
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verify clean release payload
        run: npm run release:check
      - name: Build ad-hoc signed DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri -- build --ci --bundles dmg --target ${{ matrix.target }} -- --locked
      - name: Verify packaged app and DMG integrity
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          hdiutil verify "${dmgs[0]}"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmgs[0]}"
          product_name="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          app="$mount_dir/$product_name.app"
          codesign --verify --deep --strict "$app"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          executable="$app/Contents/MacOS/$executable_name"
          file "$executable"
          test "$(lipo -archs "$executable")" = "$RELEASE_ARCH"
          expected_version="$(node -p "require('./package.json').version")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$actual_version" = "$expected_version"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
          trap - EXIT
      - name: Stage DMG and checksum only
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          stage="release-artifacts/macos-$RELEASE_ARCH"
          mkdir -p "$stage"
          cp src-tauri/target/"$RELEASE_TARGET"/release/bundle/dmg/*.dmg "$stage/"
          cd "$stage"
          shasum -a 256 -- *.dmg > "SHA256SUMS-macos-$RELEASE_ARCH.txt"
          shasum -a 256 --check "SHA256SUMS-macos-$RELEASE_ARCH.txt"
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: RushLink-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: release-artifacts/macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
